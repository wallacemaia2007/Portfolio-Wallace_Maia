<section id="cta"
  class="relative py-20 md:py-28 overflow-hidden bg-gradient-to-br from-dev to-dev-dark"
  appScrollReveal revealFrom="bottom" [revealDelay]="100">

  <!-- Decorative Geometric Shapes -->
  <div class="absolute inset-0 pointer-events-none overflow-hidden" aria-hidden="true">
    <div class="absolute -top-20 -left-20 w-64 h-64 rounded-full bg-white/5"></div>
    <div class="absolute top-10 right-10 w-40 h-40 rounded-full bg-white/5"></div>
    <div class="absolute bottom-0 left-1/3 w-80 h-80 rounded-full bg-white/5"></div>
    <div class="absolute -bottom-10 -right-10 w-52 h-52 rounded-2xl rotate-45 bg-white/5"></div>
    <div class="absolute top-1/2 left-10 w-20 h-20 rounded-xl rotate-12 bg-white/5"></div>
  </div>

  <!-- Decorative Icon -->
  <div class="absolute bottom-8 right-8 lg:right-16 opacity-10 pointer-events-none" aria-hidden="true">
    <mat-icon style="font-size: 160px; width: 160px; height: 160px;" class="text-white">rocket_launch</mat-icon>
  </div>

  <div class="container mx-auto max-w-4xl px-4 lg:px-6 relative z-10 text-center">

    <!-- Title -->
    <h2 class="text-3xl md:text-4xl lg:text-5xl font-bold text-white leading-tight"
      appScrollReveal revealFrom="bottom" [revealDelay]="150">
      Pronto para trabalhar juntos?
    </h2>

    <!-- Subtitle -->
    <p class="mt-5 text-base md:text-lg text-white/75 max-w-2xl mx-auto leading-relaxed"
      appScrollReveal revealFrom="bottom" [revealDelay]="250">
      Transformo suas ideias em produtos digitais reais. Vamos criar algo incrivel.
    </p>

    <!-- Buttons -->
    <div class="mt-10 flex flex-col sm:flex-row items-center justify-center gap-4"
      appScrollReveal revealFrom="bottom" [revealDelay]="350">

      <a href="#projects" (click)="scrollTo($event, '#projects')"
        class="inline-flex items-center justify-center rounded-xl bg-white px-8 py-3.5 text-sm font-bold text-dev transition-all duration-200 hover:bg-gray-100 hover:-translate-y-0.5 active:scale-[0.98] shadow-lg hover:shadow-xl"
        aria-label="Ver projetos">
        Ver Projetos
      </a>

      <a [href]="whatsappLink" target="_blank" rel="noopener noreferrer"
        class="inline-flex items-center justify-center gap-2 rounded-xl bg-accent px-8 py-3.5 text-sm font-bold text-white transition-all duration-200 hover:bg-accent-dark hover:-translate-y-0.5 active:scale-[0.98] shadow-lg hover:shadow-xl"
        aria-label="Fale no WhatsApp">
        <mat-icon style="font-size: 18px; width: 18px; height: 18px;">chat</mat-icon>
        Fale no WhatsApp
      </a>

    </div>

  </div>
</section>
