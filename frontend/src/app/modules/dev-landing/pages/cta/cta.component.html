<section id="cta"
  class="cta-section relative py-10 md:py-18 overflow-hidden"
  appScrollReveal revealFrom="bottom" [revealDelay]="100">

  <!-- Parallax Background Image -->
  <div class="cta-parallax-bg absolute inset-0 pointer-events-none" aria-hidden="true">
    <!-- Substitua o src pela sua imagem depois -->
    <div class="cta-bg-image absolute inset-0 bg-center bg-cover bg-no-repeat"
      style="background-image: url('assets/images/banner_codigo.jpg'); will-change: transform;">
    </div>
    <!-- Overlay escuro em cima da imagem -->
    <div class="absolute inset-0 bg-black/60"></div>
    <!-- Gradiente sutil na parte de baixo -->
    <div class="absolute bottom-0 left-0 right-0 h-32 bg-gradient-to-t from-black/40 to-transparent"></div>
  </div>

  <!-- Conteúdo -->
  <div class="container mx-auto max-w-3xl px-4 lg:px-6 relative z-10 text-center">

    <!-- Tag / label acima do título -->
    <div class="inline-flex items-center gap-2 bg-white/10 backdrop-blur-sm border border-white/20
                rounded-full px-4 py-1.5 mb-8"
      appScrollReveal revealFrom="bottom" [revealDelay]="120">
      <span class="w-2 h-2 rounded-full bg-accent animate-pulse"></span>
      <span class="text-xs font-bold tracking-widest uppercase text-white/80">Disponível para projetos</span>
    </div>

    <!-- Título -->
    <h2 class="text-4xl md:text-5xl lg:text-6xl font-black text-white leading-[1.1] tracking-tight"
      appScrollReveal revealFrom="bottom" [revealDelay]="180">
      Pronto para trabalhar<br>
      <span class="text-transparent bg-clip-text bg-gradient-to-r from-dev-light to-accent-light">
        juntos?
      </span>
    </h2>

    <!-- Subtítulo -->
    <p class="mt-6 text-base md:text-lg text-white/60 max-w-xl mx-auto leading-relaxed"
      appScrollReveal revealFrom="bottom" [revealDelay]="260">
      Transformo suas ideias em produtos digitais reais.<br class="hidden sm:block">
      Vamos criar algo incrível.
    </p>

    <!-- Botões -->
    <div class="mt-12 flex flex-col sm:flex-row items-center justify-center gap-4"
      appScrollReveal revealFrom="bottom" [revealDelay]="340">

      <!-- Primário: Ver Projetos -->
      <a href="#projects" (click)="scrollTo($event, '#projects')"
        class="group inline-flex items-center justify-center gap-2
               rounded-2xl bg-white px-8 py-4 text-sm font-bold text-dev
               transition-all duration-300
               hover:bg-gray-100 hover:-translate-y-1 hover:shadow-2xl hover:shadow-white/20
               active:scale-[0.97]"
        aria-label="Ver projetos">
        Ver Projetos
        <mat-icon class="transition-transform duration-300 group-hover:translate-x-1"
          style="font-size: 18px; width: 18px; height: 18px;">arrow_forward</mat-icon>
      </a>

      <!-- Secundário: WhatsApp -->
      <a [href]="whatsappLink" target="_blank" rel="noopener noreferrer"
        class="group inline-flex items-center justify-center gap-2
               rounded-2xl bg-accent px-8 py-4 text-sm font-bold text-white
               transition-all duration-300
               hover:bg-accent-dark hover:-translate-y-1 hover:shadow-2xl hover:shadow-accent/30
               active:scale-[0.97]"
        aria-label="Fale no WhatsApp">
        <mat-icon style="font-size: 18px; width: 18px; height: 18px;">chat</mat-icon>
        Fale no WhatsApp
      </a>

    </div>

  </div>
</section>
