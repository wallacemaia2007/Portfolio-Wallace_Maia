<app-header></app-header>
<!-- Main -->
<main>
    @if (routerLinks.hero) {
    <app-hero />
    }

    @if (routerLinks.projects) {
    <app-projects />
    }

    @if (routerLinks.stack) {
    <app-stack />
    }

    @if (routerLinks.contact) {
    <app-contact />
    }

    @if (routerLinks.cta) {
    <app-cta />
    }

</main>

<app-footer></app-footer>
<!-- Botão flutuante WhatsApp -->
<a [href]="whatsappFloatingLink" target="_blank" rel="noopener noreferrer" aria-label="Pedir agora no WhatsApp"
    class="fixed bottom-5 right-5 z-50 flex h-14 w-14 items-center justify-center rounded-full bg-accent text-white shadow-card transition-transform duration-300 hover:-translate-y-1 active:scale-[0.98]">
    <img src="/assets/icons/whatsapp.png" alt="Whatsapp" />

</a>
