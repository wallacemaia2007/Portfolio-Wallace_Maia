<section
  class="min-h-screen flex items-center py-32 transition-all duration-300 bg-beige dark:bg-custom-black"
>
  <div class="container mx-auto px-4">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-16 items-center">
      <!-- LEFT -->
      <div class="space-y-8" data-hero-left>
        <div class="space-y-4">
          <p class="text-primary font-semibold text-xl flex items-center space-x-2" data-hero-kicker>
            <mat-icon class="inline-block" data-hero-wave>waving_hand</mat-icon>
            <span>Olá, eu   sou</span>
          </p>

          <h1
            class="text-6xl md:text-7xl lg:text-8xl font-bold text-custom-black dark:text-white"
            data-hero-name
          >
            {{ personalInfo.name }}
          </h1>

          <h2
            class="text-4xl md:text-5xl lg:text-6xl font-semibold text-primary"
            data-hero-role
          >
            {{ personalInfo.role }}
          </h2>

          <p class="text-primary font-semibold text-xl flex items-center space-x-2" data-hero-stack>
            <span>Java | Angular | Spring Boot</span>
          </p>
        </div>

        <p
          class="text-xl md:text-2xl text-gray-700 dark:text-gray-400 max-w-xl leading-relaxed"
          data-hero-desc
        >
          {{ personalInfo.description }}
        </p>

        <div class="flex flex-col sm:flex-row gap-6 pt-4" data-hero-actions>
          <app-button
            [buttonData]="{
              label: 'Ver Projetos',
              icon: 'work',
              link: '/projects',
              color: 'primary'
            }"
          ></app-button>

          <app-button
            [buttonData]="{
              label: 'Contato',
              icon: 'email',
              link: '/contact',
              color: 'custom-black-light'
            }"
          ></app-button>
        </div>

        <!-- CODE BOX / TERMINAL (opcional mas fica MUITO massa) -->
        <div
          class="mt-10 rounded-2xl border border-gray-200 dark:border-gray-800 bg-white/70 dark:bg-custom-black-light/60 backdrop-blur-md shadow-lg overflow-hidden"
          data-hero-terminal
        >
          <div class="flex items-center justify-between px-4 py-3 border-b border-gray-200 dark:border-gray-800">
            <div class="flex items-center gap-2">
              <span class="w-3 h-3 rounded-full bg-red-400"></span>
              <span class="w-3 h-3 rounded-full bg-yellow-400"></span>
              <span class="w-3 h-3 rounded-full bg-green-400"></span>
            </div>
            <span class="text-xs text-gray-600 dark:text-gray-300 font-mono">terminal</span>
          </div>

          <div class="p-4 font-mono text-sm text-gray-700 dark:text-gray-200 leading-relaxed">
            <div class="opacity-70">~/portfolio</div>
            <div class="mt-2">
              <span class="text-primary font-semibold">$</span>
              <span class="ml-2" data-hero-typed></span>
              <span class="inline-block w-2 h-4 align-middle ml-1 bg-primary" data-hero-cursor></span>
            </div>

            <div class="mt-3 opacity-80" data-hero-terminal-lines>
              <div>// carregando módulos...</div>
              <div>// Angular + TypeScript + Java + Spring Boot</div>
            </div>
          </div>
        </div>
      </div>

      <!-- RIGHT -->
      <div class="relative lg:order-last order-first" data-hero-right>
        <div class="relative z-10" data-hero-avatar-wrap>
          <div
            class="w-full max-w-lg mx-auto aspect-square rounded-full overflow-hidden border-8 border-white dark:border-custom-black shadow-2xl"
            data-hero-avatar
          >
            <img [src]="personalInfo.avatar" [alt]="personalInfo.name" class="w-full h-full object-cover">
          </div>
        </div>

        <div class="absolute top-0 right-0 w-96 h-96 bg-primary/10 rounded-full blur-3xl -z-10" data-hero-glow-1></div>
        <div class="absolute bottom-0 left-0 w-96 h-96 bg-primary/10 rounded-full blur-3xl -z-10" data-hero-glow-2></div>
      </div>
    </div>
  </div>
</section>
